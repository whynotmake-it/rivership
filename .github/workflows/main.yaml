name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  semantic_pull_request:
    name: Check PR Title
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  changes:
    name: Find Affected Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.affected.outputs.full }}
      matrix: ${{ steps.affected.outputs.matrix }}
      has_tests: ${{ steps.affected.outputs.has_tests }}
      motor: ${{ steps.affected.outputs.motor }}
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.4.0' # keep in sync with the melos constraint in pubspec.yaml
          run-bootstrap: false

      - name: 🔎 Find affected packages
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: tool/ci/affected_packages.sh --base "origin/$BASE_REF"

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-flutter

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.4.0' # keep in sync with the melos constraint in pubspec.yaml

      - name: 🧪 Run Analyze
        run: melos run analyze

  test:
    name: Test (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.has_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-flutter

      - name: 📦 Get dependencies
        # One resolution for the whole pub workspace.
        run: flutter pub get

      - name: 🎬 Install FFmpeg
        # snaptest's video recording shells out to ffmpeg.
        if: ${{ matrix.ffmpeg }}
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}

      - name: 📝 Run Test
        working-directory: ${{ matrix.path }}
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.name }}
          path: ${{ matrix.path }}/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Upload golden test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.name }}
          path: ${{ matrix.path }}/**/test/**/failures/**
          if-no-files-found: ignore

  benchmark_smoke:
    name: Benchmark Smoke
    needs: changes
    if: ${{ needs.changes.outputs.motor == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-flutter

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.4.0' # keep in sync with the melos constraint in pubspec.yaml

      - name: ⏱️ Benchmark Smoke
        run: melos run benchmark:smoke

  coverage:
    name: Coverage
    needs: [changes, test]
    if: ${{ needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter

      - name: 📥 Download coverage
        uses: actions/download-artifact@v4
        with:
          pattern: lcov-*
          path: ${{ runner.temp }}/lcov

      - name: 🗂️ Place coverage in the packages
        # Packages that did not run keep their committed lcov.info.
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          jq -r '.[] | [.name, .path] | @tsv' <<<"$MATRIX" | while IFS=$'\t' read -r name path; do
            mkdir -p "$path/coverage"
            cp "$RUNNER_TEMP/lcov/lcov-$name/lcov.info" "$path/coverage/lcov.info"
          done

      - name: 📊 Generate Coverage
        id: coverage-report
        uses: whynotmake-it/dart-coverage-assistant@v1.1
        with:
          lower_threshold: 30
          upper_threshold: 50
          generate_badges: pr

  build_check:
    name: Build Check
    needs: [analyze, test, benchmark_smoke, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac

  sdk_borders:
    needs: changes
    if: ${{ needs.changes.outputs.motor == 'true' }}
    name: SDK Borders (${{ matrix.package }}, ${{ matrix.flutter }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [fixed_ticker, motor]
        flutter: [min, stable]
        include:
          - package: fixed_ticker
            flutter: min
            version: '3.24.0' # fixed_ticker's minimum (Dart 3.5)
          - package: motor
            flutter: min
            version: '3.32.0' # motor's minimum
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v5

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          channel: stable
          cache: true

      # Resolve the package on its own, since workspaces need Dart 3.6.
      - name: 📦 Leave the workspace
        working-directory: packages
        run: |
          rm -f ../pubspec.yaml ../pubspec.lock
          rm -rf fixed_ticker/example motor/example motor/benchmark
          for pubspec in fixed_ticker/pubspec.yaml ${{ matrix.package }}/pubspec.yaml; do
            sed -i '/^resolution: workspace/d' "$pubspec"
          done
          if [ "${{ matrix.package }}" = motor ]; then
            printf '\ndependency_overrides:\n  fixed_ticker:\n    path: ../fixed_ticker\n' >> motor/pubspec.yaml
          fi
          # lintervention needs Dart 3.8; below that, use the default lints.
          dart_version=$(dart --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ "$(printf '%s\n' 3.8.0 "$dart_version" | sort -V | head -1)" != 3.8.0 ]; then
            sed -i '/lintervention/d' ${{ matrix.package }}/pubspec.yaml ${{ matrix.package }}/analysis_options.yaml
          fi

      - name: 🧪 Analyze and test
        working-directory: packages/${{ matrix.package }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib test
          flutter test

  check_generation:
    name: Check Code Generation
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-flutter

      - name: Ⓜ️ Set up Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.4.0' # keep in sync with the melos constraint in pubspec.yaml

      - name: 🔨 Generate
        run: melos run generate

      - name: 🔎 Check there are no uncommitted changes
        run: |
          git add .
          git diff --cached --exit-code -- . \
            ':!**/GeneratedPluginRegistrant.swift'
  
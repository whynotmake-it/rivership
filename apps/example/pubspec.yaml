name: example
description: "A new Flutter project."
resolution: workspace

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  coil_example:
    path: ../../packages/coil/example
  cupertino_icons: ^1.0.8
  figma_squircle_updated: ^1.0.1
  flutter:
    sdk: flutter
  heroine_example:
    path: ../../packages/heroine/example
  motor_devtools:
    path: ../../packages/motor_devtools
  motor_example:
    path: ../../packages/motor/example
  stupid_simple_sheet_example:
    path: ../../packages/stupid_simple_sheet/example


  rivership: ^0.4.0+10
  auto_route: ^10.0.1
  url_launcher: ^6.3.3

  

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: packages/motor_example/assets/JetBrainsMono-VariableFont_wght.ttf
    # coil bundles no fonts. The coil catalog declares them in its own app, so
    # the aggregate app declares the same families from coil_example's assets.
    - family: Allo
      fonts:
        - asset: packages/coil_example/fonts/allo/AlloVariable.ttf
    - family: Inter
      fonts:
        - asset: packages/coil_example/fonts/inter/InterVariable.ttf

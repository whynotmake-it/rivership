name: coil_example
description: The coil catalog. Every component and foundation, live, with
  theme, tier, text scale, RTL, contrast and motion controls.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  auto_route: ^10.0.1
  coil:
    path: ../
  flutter:
    sdk: flutter
  lucide_icons_flutter: 4.0.1
  motor:
    path: ../../motor
  motor_devtools:
    path: ../../motor_devtools
  motor_widgets:
    path: ../../motor_widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  lintervention: ^0.3.1
  snaptest:
    path: ../../snaptest

flutter:
  uses-material-design: false
  assets:
    - assets/images/dunes.jpg
  # The fonts coil has tuned typography for. coil bundles none: an app adds
  # the ones it uses, with their licenses, and picks the matching
  # CoilTypography preset.
  fonts:
    - family: Allo
      fonts:
        - asset: lib/fonts/allo/AlloVariable.ttf
    - family: Inter
      fonts:
        - asset: lib/fonts/inter/InterVariable.ttf
    # Code in the usage snippets. The aggregate app already declares this
    # family from motor_example's copy.
    - family: JetBrains Mono
      fonts:
        - asset: lib/fonts/jetbrains_mono/JetBrainsMonoVariable.ttf

name: coil
description: >-
  A Flutter design system built on Motor springs, inspired by Fluid
  Functionalism. Works under any WidgetsApp.
version: 0.1.0-dev.0
resolution: workspace
repository: https://github.com/whynotmake-it/rivership/tree/main/packages/coil
issue_tracker: https://github.com/whynotmake-it/rivership/issues
homepage: https://whynotmake.it

topics: [design-system, ui, animation, spring, accessibility]

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  corner_radius_plugin: ^1.0.0
  cupertino_ui: ^1.1.6
  fixed_ticker: ^0.2.0
  # Only lib/src/components/markdown/ imports it (import_rules_test).
  markdown: ^7.3.1
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  motor: ^2.0.0-dev.0
  motor_widgets: ^0.1.0-dev.0
  scroll_drag_detector: ^1.0.0-dev.4
  stupid_simple_sheet: ^1.0.0-dev.8

dev_dependencies:
  coil_cli: ^0.1.0-dev.0
  flutter_test:
    sdk: flutter
  lintervention: ^0.3.1
  snaptest: ^1.0.0-dev.7

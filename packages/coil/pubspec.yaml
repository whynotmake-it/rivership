name: coil
description: >-
  A Flutter design system built on Motor springs, inspired by Fluid
  Functionalism. Works under any WidgetsApp.
version: 0.0.1-dev.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  analyzer: ^13.3.0
  args: ^2.7.0
  cupertino_ui: ^1.1.6
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  material_ui: ^1.11.0
  motor:
    path: ../motor
  motor_widgets:
    path: ../motor_widgets
  package_config: ^2.2.0
  path: ^1.9.1
  stupid_simple_sheet:
    path: ../stupid_simple_sheet
  yaml: ^3.1.4

dev_dependencies:
  lintervention: ^0.3.1
  snaptest:
    path: ../snaptest

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/InterVariable.ttf

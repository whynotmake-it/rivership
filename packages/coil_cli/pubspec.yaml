name: coil_cli
description: >-
  Ejects coil components into a Flutter app, merges coil's later changes
  into the copies, and checks their interaction patterns in tests.
version: 0.0.1-dev.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

executables:
  eject:
  update:

dependencies:
  analyzer: ^13.3.0
  args: ^2.7.0
  coil:
    path: ../coil
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  package_config: ^2.2.0
  path: ^1.9.1
  yaml: ^3.1.4

dev_dependencies:
  lintervention: ^0.3.1

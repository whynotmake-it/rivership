name: fluid_functionalism
description: >-
  A Flutter port of the Fluid Functionalism design system, built on Motor.
  Spike - not published.
version: 0.0.1-dev.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  motor:
    path: ../motor

dev_dependencies:
  flutter_test:
    sdk: flutter
  lintervention: ^0.3.1
  snaptest:
    path: ../snaptest

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/InterVariable.ttf

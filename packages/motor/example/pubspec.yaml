name: motor_example
description: "Motor's interactive example gallery, built with coil."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  auto_route: ^10.0.1
  coil:
    path: ../../coil
  example_design:
    path: ../../example_design
  fixed_ticker:
    path: ../../fixed_ticker
  flutter:
    sdk: flutter
  lucide_icons_flutter: 4.0.1
  motor:
    path: ../
  motor_devtools:
    path: ../../motor_devtools
  motor_widgets:
    path: ../../motor_widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  snaptest:
    path: ../../snaptest

flutter:
  uses-material-design: false

  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: lib/assets/JetBrainsMono-VariableFont_wght.ttf
